services:
  - type: web
    name: frontend
    env: node
    buildCommand: cd frontend && npm install --include=dev && npm run build
    startCommand: cd frontend && npm install --include=dev && npm run preview -- --host
    envVars:
      - key: NODE_ENV
        value: production
    
  - type: web
    name: backend
    env: python
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
      chmod +x db_setup.sh
    startCommand: |
      cd backend
      # Start gunicorn in the background
      gunicorn TeamBuilder.wsgi:application --bind=0.0.0.0:$PORT &
      # Run the setup script which waits for the server to be ready
      ./db_setup.sh
      # Keep the container running by waiting for the gunicorn process
      wait
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: TeamBuilder.settings_prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        value: sqlite:///persistentdb/db.sqlite3
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/persistentdb
      sizeGB: 1 